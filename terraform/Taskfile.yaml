# Taskfile for o11y-cloudfront-streaming Terraform
# ============================================
#
# Modules and their deployment order:
#   1. iam/      - CloudFront/Firehose/Lambda execution roles (own state, deploy first)
#   2. (root)    - Kinesis, Firehose, Lambda transform, CloudFront realtime log config (streaming:*)
#
# Prerequisites:
#   - o11y-platform's opensearch module must already be deployed for the target
#     venue (any o11y_cloudfront_streaming_enabled value) -- this repo
#     reads the OpenSearch domain and security group from SSM.
#   - brew install go-task/tap/go-task
#   - Run `task auth` and follow the instructions to export SSO credentials.
#
# tfvars:
#   By default, tfvars are read from a local cds-infra-deploy checkout:
#     export CDS_INFRA_DEPLOY_DIR=/path/to/cds-infra-deploy
#     task iam:plan VENUE=dev
#   To use this repo's own (gitignored) tfvars/ dirs instead -- e.g. for personal
#   iteration before promoting values to cds-infra-deploy -- pass LOCAL=1:
#     task iam:plan VENUE=dev LOCAL=1

---

version: '3'

tasks:

    # ------------------------------------------------------------------
    # AWS helper
    # ------------------------------------------------------------------

    aws:
        desc: "Verify AWS credentials are configured"
        silent: true
        cmds:
            - aws sts get-caller-identity --output json

    auth:
        desc: "Export SSO credentials as env vars for Terraform (re-run when session expires)"
        silent: true
        cmds:
            - |
              echo "Run the following in your shell to authenticate Terraform:"
              echo ""
              echo '  eval $(aws configure export-credentials --profile <your-profile> --format env)'
              echo ""
              echo "Credentials are valid for ~1 hour."

    # ------------------------------------------------------------------
    # IAM: CloudFront/Firehose/Lambda execution roles
    # Deploy before streaming:* -- the main module reads role ARNs from SSM.
    # ------------------------------------------------------------------

    iam:init:
        desc: "Initialize IAM module Terraform"
        deps: [aws]
        dir: iam
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform init -no-color -reconfigure -backend-config=backend-{{.VENUE}}.hcl {{.CLI_ARGS}}

    iam:validate:
        desc: "Validate IAM module Terraform files"
        dir: iam
        cmds:
            - terraform init -backend=false -no-color
            - terraform validate -no-color

    iam:plan:
        desc: "Plan IAM role changes"
        deps: ["iam:init"]
        dir: iam
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-streaming/iam.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform plan -var-file={{.TFVARS}} {{.CLI_ARGS}}

    iam:deploy:
        desc: "Deploy IAM roles (deploy before streaming:deploy)"
        aliases: ["iam:apply"]
        deps: ["iam:init"]
        dir: iam
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-streaming/iam.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform apply -var-file={{.TFVARS}} {{.CLI_ARGS}}

    iam:destroy:
        desc: "Destroy IAM roles (run streaming:destroy first)"
        deps: ["iam:init"]
        dir: iam
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-streaming/iam.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform apply -destroy -var-file={{.TFVARS}} {{.CLI_ARGS}}

    iam:refresh:
        desc: "Refresh IAM module Terraform state"
        deps: ["iam:init"]
        dir: iam
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-streaming/iam.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform plan -refresh-only -var-file={{.TFVARS}} {{.CLI_ARGS}}

    iam:sync:
        desc: "Apply refresh-only to sync IAM state without changing infrastructure"
        deps: ["iam:init"]
        dir: iam
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-streaming/iam.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform apply -refresh-only -var-file={{.TFVARS}} {{.CLI_ARGS}}

    iam:show:
        desc: "Show IAM module Terraform state"
        deps: ["iam:init"]
        dir: iam
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform show

    # ------------------------------------------------------------------
    # Streaming: Kinesis, Firehose, Lambda transform, CloudFront realtime log config
    # Requires iam:deploy and o11y-platform's opensearch:deploy first -- reads
    # role ARNs and the OpenSearch domain/security group from SSM.
    # ------------------------------------------------------------------

    streaming:init:
        desc: "Initialize the main module Terraform"
        deps: [aws]
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform init -no-color -reconfigure -backend-config=backend-{{.VENUE}}.hcl {{.CLI_ARGS}}

    streaming:validate:
        desc: "Validate the main module Terraform files"
        cmds:
            - terraform validate -no-color

    streaming:plan:
        desc: "Plan Kinesis/Firehose/Lambda/CloudFront log config changes"
        deps: ["streaming:init"]
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-streaming/streaming.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform plan -var-file={{.TFVARS}} {{.CLI_ARGS}}

    streaming:deploy:
        desc: "Deploy the real-time log pipeline (requires iam:deploy first)"
        aliases: ["streaming:apply"]
        deps: ["streaming:init"]
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-streaming/streaming.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform apply -var-file={{.TFVARS}} {{.CLI_ARGS}}

    streaming:destroy:
        desc: "Destroy the real-time log pipeline (run before iam:destroy)"
        deps: ["streaming:init"]
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-streaming/streaming.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform apply -destroy -var-file={{.TFVARS}} {{.CLI_ARGS}}

    streaming:refresh:
        desc: "Refresh the main module Terraform state"
        deps: ["streaming:init"]
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-streaming/streaming.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform plan -refresh-only -var-file={{.TFVARS}} {{.CLI_ARGS}}

    streaming:sync:
        desc: "Apply refresh-only to sync main module state without changing infrastructure"
        deps: ["streaming:init"]
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-streaming/streaming.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform apply -refresh-only -var-file={{.TFVARS}} {{.CLI_ARGS}}

    streaming:show:
        desc: "Show the main module Terraform state"
        deps: ["streaming:init"]
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform show

    # ------------------------------------------------------------------
    # Default
    # ------------------------------------------------------------------

    default:
        cmds:
            - task --list
        silent: true

...

