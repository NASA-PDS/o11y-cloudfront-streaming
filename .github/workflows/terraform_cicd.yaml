name: 'Terraform-Workflow'

on: [push, workflow_dispatch]

permissions:
  id-token: write  # required to use OIDC authentication
  contents: read # required to checkout the code from the repo

jobs:
  deploy:
    name: 'Terraform (${{ matrix.module }})'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [terraform, terraform/iam]
    defaults:
      run:
        shell: bash
        working-directory: ./${{ matrix.module }}
    env:
      TF_LOG: INFO

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    # AWS Authentication. Please uncomment this step in your repo to authenticate to AWS.

    # - name: Configure AWS Credentials
    #   uses: aws-actions/configure-aws-credentials@v2
    #   with:
    #     aws-region: "${{ secrets.AWS_REGION }}"
    #     role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
    #     role-session-name: PDS_GitHub_OIDC_TERRAFORM

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4

    - name: Terraform Init
      id: init
      env:
        VENUE: dev
      run: terraform init -backend-config="backend-${VENUE}.hcl"

    - name: Terraform Format & Validate
      id: fmt_validate
      run: |
        terraform fmt -check
        terraform validate -no-color

    # Please uncomment the plan and apply steps below in your terraform worfklow to deploy your infrastructure to AWS.
    # Deploy terraform/iam before terraform/ — the main module reads role ARNs from SSM.

    # - name: Terraform Plan
    #   id: plan
    #   run: terraform plan -no-color
    #   continue-on-error:  true

    # - name: Terraform Plan Status
    #   id : plan_status
    #   if: steps.plan.outcome == 'failure'
    #   run: exit 1

    # - name: Terraform Apply
    #   if: github.ref == 'refs/heads/main' && github.event_name == 'push' # both conditions have to be met
    #   run: terraform apply -auto-approve

  validate-conventions:
    name: 'Validate PDS Terraform conventions'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Validate PDS Terraform conventions
      run: python3 scripts/validate_terraform.py terraform/ --github
